name: Build APK & Windows-Setup

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Läufe nacheinander abarbeiten, damit immer die neueste Version „Latest“ wird
concurrency:
  group: nova-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: KI-Modelle laden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Modell-Cache
        uses: actions/cache@v4
        with:
          path: models
          key: nova-models-${{ hashFiles('scripts/ai-catalog.json', 'scripts/fetch-models.js') }}
      - name: Modelle von Hugging Face laden (vorinstalliert) & Katalog erstellen
        run: node scripts/fetch-models.js
      - name: Größe
        run: du -sh models && find models -type f | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: nova-models
          path: models
          retention-days: 3
          compression-level: 0

  ai-test:
    name: KI testen (echter Browser)
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nova-models
          path: models
      - name: KI-Bibliothek bereitstellen
        run: node scripts/vendor.js
      - name: Browser finden (vorinstalliertes Chrome)
        run: |
          P=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          echo "Browser: $P"
          "$P" --version
          echo "CHROME_PATH=$P" >> "$GITHUB_ENV"
          npm install --no-save playwright-core@1.56.1
      - name: KI-Test
        run: node scripts/ai-smoke-test.js

  android:
    name: Android APK
    needs: models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Das Android-SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME)
      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Abhängigkeiten
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: nova-models
          path: models
      - name: Web-App kopieren & Capacitor sync
        run: |
          node scripts/build-web.js
          npx cap sync android
      - name: APK bauen (signiert)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Nova-OS-${VERSION}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: nova-android
          path: out/*.apk
          compression-level: 0

  windows:
    name: Windows Setup (.exe)
    needs: models
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: nova-models
          path: models
      - name: Setup bauen
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: dist/*.exe
          compression-level: 0

  release:
    name: GitHub-Release veröffentlichen
    needs: [android, windows, ai-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-{android,windows}
          path: files
          merge-multiple: true
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release-Text erstellen
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Nova OS ${VERSION}"
            echo
            echo "### Download"
            echo "| Gerät | Datei |"
            echo "|---|---|"
            echo "| 🤖 Android | [Nova-OS-${VERSION}.apk](https://github.com/${REPO}/releases/download/v${VERSION}/Nova-OS-${VERSION}.apk) |"
            echo "| 🪟 Windows | [Nova-OS-Setup-${VERSION}.exe](https://github.com/${REPO}/releases/download/v${VERSION}/Nova-OS-Setup-${VERSION}.exe) |"
            echo
            echo "**Android:** APK öffnen. Beim ersten Mal „Installation aus unbekannten Quellen“ erlauben. Updates einfach **über die alte Version installieren**, dann bleiben alle Konten erhalten."
            echo
            echo "**Windows:** Setup starten. Es legt ein Desktop- und Startmenü-Symbol an. Warnt SmartScreen, „Weitere Informationen“ → „Trotzdem ausführen“ wählen."
            echo
            echo "### Neu in dieser Version"
            # Erste Zeile = Titel, danach die Stichpunkte; Signaturzeilen weglassen
            printf '%s\n' "${COMMIT_MSG}" | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e '1s/^/**/' -e '1s/$/**/'
            echo
            echo "Nova läuft komplett ohne Internet."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nova OS ${{ steps.v.outputs.version }}
          prerelease: false
          make_latest: true
          files: files/*
          body_path: release-notes.md
